name: Publish to PyPI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Python Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Nix with Flakes Support
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Maven Packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Validate Schemas
        run: nix develop --command mvn --settings ci/mvn_settings.xml --batch-mode -Dtest=JsonSchemaValidationTest test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Generate Python Models
        run: |
          nix develop --command bash -c '
            mkdir -p src/arca_models/
            datamodel-codegen \
              --input-file-type jsonschema \
              --input schemas/arca/ \
              --output src/arca_models/ \
              --output-model-type pydantic_v2.BaseModel \
              --field-constraints \
              --use-schema-description \
              --use-standard-collections \
              --use-generic-container-types \
              --target-python-version 3.12
          '

      - name: Build Python Distributions
        run: |
          nix develop --command bash -e -c '
            uv sync --frozen
            uv build
          '

      - name: Upload Python Distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/arca-models
    permissions:
      id-token: write
    steps:
      - name: Download Python Distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
